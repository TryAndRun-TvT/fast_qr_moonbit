# fast_qr_moonbit 云原生构建配置
# 说明：CPU 设置为 2，未启用 docker 服务
#
# 配置结构:
#   vscode — 云原生开发环境启动时初始化 MoonBit 工具链
#
# 关于已移除的 push 流水线（2026-09-14）：
#   原 `push` 流水线（setup-moonbit / fmt-check / check / test / docs-link-check /
#   test-scale / build-and-run / diff-gate / publish-check）**已整体移除**，
#   原因是其耗时与资源占用对当前迭代节奏收益不成比例（每次推送都重复全量构建+测试）。
#   门禁**不因移除而失效**：全部阶段命令本就抽离在 `scripts/` 下，一条命令跑全量：
#
#     bash scripts/gates.sh            # 跑全部阶段（阶段清单以脚本输出为准，勿在此写死）
#     STAGES="check test" bash scripts/gates.sh    # 只跑指定阶段
#     SKIP_SLOW=1        bash scripts/gates.sh    # 跳过 build-and-run
#
#   发布（**不在**本文件内执行：需本地凭据）：`bash scripts/publish.sh`（默认干跑）。
#
#   若日后需恢复 CI，把 `bash scripts/gates.sh` 作为单个 stage 挂回 `push:` 即可（脚本零改动）。

$:
  vscode:
    - runner:
        cpus: 2
      services:
        - vscode
      stages:
        - name: setup-moonbit-toolchain
          script: bash scripts/setup-moonbit.sh
