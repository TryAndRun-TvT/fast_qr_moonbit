# fast_qr_moonbit 云原生构建配置
# 说明：CPU 设置为 2，未启用 docker 服务
#
# 配置结构:
#   vscode — 云原生开发环境启动时初始化 MoonBit 工具链
#   push   — 每次推送代码时执行 MoonBit 安装+构建+测试 CI
#
# 各阶段的具体命令已抽离到 scripts/ 目录下的独立脚本，便于维护与复用；
# 此处仅以 bash scripts/<name>.sh 方式调用，不再内嵌长命令。

$:
  vscode:
    - runner:
        cpus: 2
      services:
        - vscode
      stages:
        - name: setup-moonbit-toolchain
          script: bash scripts/setup-moonbit.sh

  push:
    - name: moonbit-ci
      runner:
        cpus: 2
      stages:
        - name: setup-moonbit
          script: bash scripts/setup-moonbit.sh
        # 先校验格式：moon fmt 会格式化 moon.mod / moon.pkg / 所有 .mbt，
        # 提前拦截配置与代码格式腐化。
        - name: fmt-check
          script: bash scripts/fmt-check.sh
        - name: check
          script: bash scripts/check.sh
        - name: test
          script: bash scripts/test.sh
        # 多后端回归：默认后端 wasm-gc + 兼容后端 wasm(WASI) + js
        # 注意：不要加 native 阶段 —— 需系统 C 编译器，本镜像未安装。
        - name: build-and-run
          script: bash scripts/build-and-run.sh
